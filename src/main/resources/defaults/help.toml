# ============================================================
#  HELP  —  what /help shows
#  Each player only sees the commands they can use.
# ============================================================

[display]
header = "&6&l✦ Help ✦ &7(page {page}/{pages})"
# How each command looks. Available: {command} {description}
line = "&e/{command} &7- &f{description}"
# Shown for commands with no description below.
no_description = "&8(no description)"
per_page = 10

# Also list commands from vanilla and other mods.
show_other_commands = true

# Commands never listed (they still work).
hidden = []

[descriptions]
