plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.165'
}

version = mod_version
group = 'com.tac5studios.elementsnexus'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // YAML storage library, bundled inside the mod jar (jar-in-jar).
    // SQLite and MySQL drivers are not bundled: servers that use those backends
    // put the driver jar in elements_nexus/drivers (see storage.toml).
    implementation "org.yaml:snakeyaml:${snakeyaml_version}"
    jarJar("org.yaml:snakeyaml:[2.2,3.0)") { version { prefer snakeyaml_version } }
}

// The full jar (with the bundled YAML library) is the main output: elements_nexus-<version>.jar
// The jar without libraries is marked "-slim" and is not used.
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('jarJar') { archiveClassifier = '' }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
